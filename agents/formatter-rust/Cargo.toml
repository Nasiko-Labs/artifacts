[package]
name = "formatter-rust"
version = "1.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
a2a-server = { git = "https://github.com/a2aproject/a2a-rs", rev = "0243a8129d69637dba728277dc60d696cf7d15c1", package = "a2a-server-lf" }
a2a = { git = "https://github.com/a2aproject/a2a-rs", rev = "0243a8129d69637dba728277dc60d696cf7d15c1", package = "a2a-lf" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
futures = "0.3"
async-stream = "0.3"
chrono = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
axum = "0.8"
regex = "1"
fancy-regex = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.28"
tracing-opentelemetry = "0.29"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
